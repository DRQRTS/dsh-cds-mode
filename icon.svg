<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CDS mode — Chen's DS">
  <title>CDS mode (Chen's DS)</title>

  <!--
    Design notes
    ------------
    Monochrome, painted with `currentColor`: the Host renders this beside other
    plugin icons and the UI theme picks the colour. No hardcoded fills means one
    asset works in light and dark.

    The mark is one hub with four satellites — the mode is one persona (Chen)
    that dispatches the others and is the only voice reaching the user. Six
    shapes in total (plate, hub, four satellites) with thick strokes, so it
    survives 16-20 px where icon detail dies.

    Geometry, all verified to fit inside the 64-unit box:
      plate      circle r=29 at centre (2-unit margin)
      hub        r=8  at centre
      satellites r=4.5 at distance 21 from centre, on the four axes
                 -> extent 21+4.5 = 25.5 < 29, so they sit inside the plate
                 -> adjacent-satellite gap = 21*sqrt(2) - 2*4.5 = 20.7 (r=1.414)
                    at 16 px that is ~5.2 px of white between nodes: still readable
      spokes     drawn from hub edge to satellite edge, so no line pokes through
    -->

  <!-- plate -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-width="3.5"/>

  <!-- spokes: from hub edge (r=8) to satellite edge (r=21-4.5=16.5) -->
  <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="24" x2="32" y2="15.5"/>
    <line x1="32" y1="40" x2="32" y2="48.5"/>
    <line x1="24" y1="32" x2="15.5" y2="32"/>
    <line x1="40" y1="32" x2="48.5" y2="32"/>
  </g>

  <!-- satellites: the dispatched personas -->
  <g fill="currentColor">
    <circle cx="32"   cy="11"   r="4.5"/>
    <circle cx="32"   cy="53"   r="4.5"/>
    <circle cx="11"   cy="32"   r="4.5"/>
    <circle cx="53"   cy="32"   r="4.5"/>
  </g>

  <!-- hub: Chen, the single outward voice -->
  <circle cx="32" cy="32" r="8" fill="currentColor"/>
</svg>
